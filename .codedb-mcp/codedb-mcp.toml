# codedb-mcp configuration for GameDevelopmentKit.

[scan]
extensions = ["cs", "java", "rs", "py", "pyw", "lua", "js", "jsx", "mjs", "cjs", "ts", "tsx", "c", "h", "cc", "cpp", "cxx", "hpp", "hh", "hxx"]
max_file_bytes = 50000000
respect_gitignore = true
root_paths = ["Unity/Assets/Scripts", "DotNet", "Share", "Tools"]
include_paths = []
exclude_paths = []
skip_dirs = [
  ".git",
  ".hg",
  ".svn",
  ".vs",
  ".idea",
  ".gradle",
  "node_modules",
  "target",
  "dist",
  ".next",
  ".svelte-kit",
  "coverage",
  "out",
  ".codedb-mcp",
  "Temp",
  "Logs",
  "obj",
  "bin",
  "Build",
  "Builds",
]

[diagnostics]
timing = false
slow_file_ms = 0

[logging]
enabled = false
file = ".codedb-mcp/codedb-mcp.log"
queue_capacity = 8192
flush_interval_ms = 500

[watch]
enabled = true
poll_interval_seconds = 5

[storage]
enabled = true
dir = ".codedb-mcp"
